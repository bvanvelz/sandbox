services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootPassword   # change this
      MYSQL_DATABASE: testDb          # optional default DB
      MYSQL_USER: testUser                  # optional
      MYSQL_PASSWORD: testPassword          # optional
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql         # persistent data
      #- ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro # optional init script

volumes:
  mysql_data:
